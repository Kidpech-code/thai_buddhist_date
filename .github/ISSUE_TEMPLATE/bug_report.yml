name: Bug report
description: Report reproducible incorrect behavior in a package or the demo.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove secrets and personal data from logs and examples.
        For vulnerabilities, use the private process in SECURITY.md instead.
  - type: dropdown
    id: scope
    attributes:
      label: Affected scope
      options:
        - thai_buddhist_date
        - thai_buddhist_date_pickers
        - Root demo app
        - Documentation or release tooling
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "For example, 0.3.0"
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: Dart and Flutter versions
      description: Paste the relevant output from `dart --version` and `flutter --version`.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code sample and exact steps that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Optional. Redact credentials, tokens, and personal data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain secrets or personal data.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
